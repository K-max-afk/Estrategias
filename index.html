<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academia Hyperion - Simulación de Comprensión</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
</head>
<body>

    <!-- PANTALLA INICIAL / DE INICIO DE SESIÓN -->
    <div id="start-screen" class="overlay">
        <div class="start-card">
            <h1 class="glitch">ACADEMIA HYPERION</h1>
            <p>Protocolo de Reclutamiento Alfa-Niner</p>
            <button id="btn-start" class="cyber-btn">INICIAR CONEXIÓN</button>
        </div>
    </div>

    <!-- CONSOLA PRINCIPAL DE LA SIMULACIÓN -->
    <main class="console-container">
        <!-- Encabezado de la interfaz -->
        <header class="console-header">
            <div class="status-indicator">
                <span class="dot blink"></span>
                <span id="status-text">SISTEMA A.R.I.A. CONECTADO</span>
            </div>
            <div class="mission-title">MISIÓN: COMPRENSIÓN ABSOLUTA</div>
            <div class="phase-badge" id="phase-badge">ACTO 1</div>
        </header>

        <!-- Área de despliegue visual / narrativo -->
        <section class="display-area">
            <div class="hud-frame">
                <div id="act-title" class="act-header">CÓDICE DE HYPERION</div>
                <div id="story-text" class="typewriter-text"></div>
            </div>
        </section>

        <!-- Modulo interactivo de preguntas y retroalimentación -->
        <section class="interaction-area">
            <div class="question-box">
                <span class="alert-icon">⚠️</span>
                <p id="question-text">Esperando activación de protocolo...</p>
            </div>

            <!-- Entrada de respuesta de los estudiantes -->
            <div class="input-group">
                <textarea id="student-answer" placeholder="Registrar respuesta/ideas libre de los cadetes aquí..."></textarea>
                <button id="btn-submit-answer" class="cyber-btn-sub">REGISTRAR RESPUESTA</button>
            </div>

            <!-- Panel desplegable de retroalimentación para el profesor -->
            <div id="theory-panel" class="theory-panel hidden">
                <div class="theory-header">💡 RETROALIMENTACIÓN TEÓRICA PARA EL PROFESOR</div>
                <div id="theory-content" class="theory-body"></div>
                <button id="btn-next-act" class="cyber-btn-next">AVANZAR AL SIGUIENTE ACTO ➔</button>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
