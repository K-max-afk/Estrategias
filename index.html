<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experiencia Cinematográfica - Academia Arcana</title>
    <!-- Fuente Arcana Elegante -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;800&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-black: #000000;
            --gold-glow: #ffd700;
            --violet-glow: #c77dff;
            --purple-magic: #8a2be2;
            --font-title: 'Cinzel', serif;
            --font-body: 'Quicksand', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-black);
            color: #ffffff;
            font-family: var(--font-body);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* --- CONTROLES DE AUDIO MÚSICA DE FONDO --- */
        .audio-bar {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(15, 10, 25, 0.8);
            border: 1px solid rgba(255, 215, 0, 0.4);
            padding: 8px 16px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 100;
        }

        .audio-btn {
            background: none;
            border: none;
            color: var(--gold-glow);
            font-size: 1.2rem;
            cursor: pointer;
        }

        .vol-slider {
            width: 70px;
            accent-color: var(--gold-glow);
            cursor: pointer;
        }

        /* --- PANTALLA TOTALMENTE NEGRA DE INICIO --- */
        .intro-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-black);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 1.5s ease;
        }

        .orb-portal {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: radial-gradient(circle, #ffffff 0%, var(--purple-magic) 70%, transparent 100%);
            box-shadow: 0 0 40px var(--purple-magic), 0 0 80px var(--violet-glow);
            animation: pulseOrb 3s infinite ease-in-out;
            cursor: pointer;
            margin-bottom: 25px;
        }

        @keyframes pulseOrb {
            0%, 100% { transform: scale(1); box-shadow: 0 0 30px var(--purple-magic); }
            50% { transform: scale(1.08); box-shadow: 0 0 60px var(--violet-glow); }
        }

        .intro-text {
            font-family: var(--font-title);
            color: var(--violet-glow);
            letter-spacing: 3px;
            font-size: 0.95rem;
            margin-bottom: 20px;
            opacity: 0.8;
        }

        /* --- ESCENA CINEMATOGRÁFICA --- */
        .cinema-container {
            width: 100%;
            max-width: 850px;
            padding: 30px;
            text-align: center;
            z-index: 10;
        }

        .chapter-header {
            font-family: var(--font-title);
            color: var(--gold-glow);
            font-size: 0.85rem;
            letter-spacing: 4px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .scene-title {
            font-family: var(--font-title);
            font-size: 2.2rem;
            color: #ffffff;
            margin-bottom: 30px;
            text-shadow: 0 0 15px var(--purple-magic);
        }

        /* Contenedor de Recursos Visuales y Audios */
        .media-box {
            margin: 15px auto 25px auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .scene-img {
            max-width: 100%;
            max-height: 260px;
            border-radius: 8px;
            border: 1px solid var(--violet-glow);
            box-shadow: 0 0 20px rgba(138, 43, 226, 0.4);
            object-fit: cover;
        }

        .scene-audio-player {
            width: 100%;
            max-width: 380px;
            height: 32px;
            accent-color: var(--gold-glow);
        }

        /* Texto con Efecto Máquina de Escribir */
        .typewriter-text {
            font-size: 1.25rem;
            line-height: 1.8;
            color: #e0d0ff;
            min-height: 120px;
            margin-bottom: 30px;
            text-shadow: 0 0 5px rgba(0,0,0,0.8);
        }

        /* Pregunta / Desafío */
        .question-card {
            background: rgba(20, 10, 35, 0.9);
            border: 1px solid var(--gold-glow);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.15);
            margin-bottom: 25px;
            opacity: 0;
            transform: translateY(10px);
            transition: all 1s ease;
        }

        .question-card.show {
            opacity: 1;
            transform: translateY(0);
        }

        .question-text {
            font-size: 1.15rem;
            color: #ffffff;
            font-weight: 600;
        }

        /* Botones Acción Mágica */
        .btn-magic {
            font-family: var(--font-title);
            background: transparent;
            color: var(--gold-glow);
            border: 1px solid var(--gold-glow);
            padding: 12px 28px;
            font-size: 0.9rem;
            letter-spacing: 2px;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.4s ease;
            margin-top: 10px;
        }

        .btn-magic:hover {
            background: var(--gold-glow);
            color: #000000;
            box-shadow: 0 0 20px var(--gold-glow);
        }

        /* Panel Guía para Expositoras */
        .group-guide-panel {
            margin-top: 20px;
            background: rgba(10, 5, 20, 0.95);
            border: 1px dashed var(--violet-glow);
            padding: 20px;
            border-radius: 12px;
            text-align: left;
            box-shadow: 0 0 30px rgba(138, 43, 226, 0.3);
        }

        .panel-title {
            font-family: var(--font-title);
            color: var(--violet-glow);
            font-size: 0.85rem;
            letter-spacing: 1px;
            margin-bottom: 10px;
            border-bottom: 1px solid rgba(199, 125, 255, 0.3);
            padding-bottom: 5px;
        }

        .panel-body {
            font-size: 0.95rem;
            line-height: 1.6;
            color: #d1c4e9;
        }

        /* Widget Asistente IA */
        .ai-widget {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 500;
        }

        .ai-btn {
            background: var(--purple-magic);
            color: #fff;
            border: 1px solid var(--violet-glow);
            width: 48px;
            height: 48px;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 15px var(--purple-magic);
            font-size: 1.2rem;
        }

        .ai-modal {
            position: absolute;
            bottom: 60px;
            right: 0;
            width: 280px;
            background: rgba(10, 5, 20, 0.95);
            border: 1px solid var(--violet-glow);
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 0 20px rgba(0,0,0,0.9);
        }

        .ai-modal-header {
            font-family: var(--font-title);
            color: var(--violet-glow);
            font-size: 0.8rem;
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- REPRODUCTOR MÚSICA DE FONDO -->
    <div class="audio-bar">
        <button id="btn-audio-toggle" class="audio-btn">🎵</button>
        <input type="range" id="vol-slider" class="vol-slider" min="0" max="1" step="0.05" value="0.3">
        <!-- Puedes colocar la ruta de tu audio de fondo aquí -->
        <audio id="bg-music" loop src="audio/ambiente_magico.mp3"></audio>
    </div>

    <!-- PANTALLA TOTALMENTE NEGRA AL INICIAR -->
    <div id="intro-screen" class="intro-screen">
        <div class="orb-portal" id="btn-start-orb"></div>
        <p class="intro-text">TOCA EL ORBE PARA ENTRAR AL MUNDO ARCANO</p>
        <button id="btn-start" class="btn-magic">INICIAR EXPERIENCIA</button>
    </div>

    <!-- ESCENARIO CINEMATOGRÁFICO PRINCIPAL -->
    <main id="cinema-stage" class="cinema-container hidden">
        
        <div class="chapter-header" id="chapter-tag">CAPÍTULO I</div>
        <h1 class="scene-title" id="scene-title">EL GRIMORIO SIN LETRAS</h1>

        <!-- APARTADO PARA TUS IMÁGENES Y AUDIOS DE ESCENA -->
        <div class="media-box">
            <img id="scene-img" class="scene-img hidden" src="" alt="Escena Arcana">
            <audio id="scene-audio" class="scene-audio-player hidden" controls src=""></audio>
        </div>

        <!-- TEXTO NARRATIVO QUE SE ESCRIBE SOLO -->
        <div class="typewriter-text" id="typewriter-text"></div>

        <!-- TARJETA DE PREGUNTA / DISCUSIÓN -->
        <div class="question-card" id="question-card">
            <p class="question-text" id="question-text"></p>
        </div>

        <!-- CONTROLES MÁGICOS -->
        <div id="controls-zone">
            <button id="btn-reveal-guide" class="btn-magic hidden">
                ✨ VER GUÍA DE RETROALIMENTACIÓN (EXPOSITORAS)
            </button>
        </div>

        <!-- PANEL DE RETROALIMENTACIÓN PARA USTEDES COMO GRUPO -->
        <div id="group-guide" class="group-guide-panel hidden">
            <div class="panel-title">📜 GUÍA DE DISCUSIÓN PARA LAS EXPOSITORAS</div>
            <div id="guide-content" class="panel-body"></div>
            <button id="btn-next-scene" class="btn-magic" style="width: 100%; margin-top: 15px;">
                CONTINUAR LA HISTORIA ➔
            </button>
        </div>

    </main>

    <!-- ASISTENTE IA DE APOYO -->
    <div class="ai-widget">
        <button id="btn-ai" class="ai-btn">🔮</button>
        <div id="ai-modal" class="ai-modal hidden">
            <div class="ai-modal-header">
                <span>ORÁCULO A.R.I.A.</span>
                <span id="ai-close" style="cursor:pointer;">✕</span>
            </div>
            <div id="ai-text" style="font-size:0.85rem; color:#d1c4e9; line-height:1.4;"></div>
        </div>
    </div>

    <script>
        // === GUION CINEMATOGRÁFICO CON LÓGICA CONTINUA ===
        const historiaArcana = [
            {
                capitulo: "CAPÍTULO I",
                titulo: "EL GRIMORIO SIN LETRAS",
                imagen: "", // Agrega ruta: "img/cap1.jpg"
                audioNarracion: "", // Agrega ruta: "audio/cap1.mp3"
                texto: "Han cruzado el umbral de la Academia Arcana. Ante ustedes flota un libro de cristal antiguo. Muchos intentan 'mirar' sus páginas, pero el cristal se apaga. Creen que leer es solo pasar los ojos sobre el texto, y por eso la magia no despierta...",
                pregunta: "✨ Pregunta a la clase: ¿Por qué creen que solo 'mirar' las palabras no funciona? ¿Qué significa realmente COMPRENDER para activar el poder del libro?",
                retroalimentacion: "<b>Concepto a retroalimentar:</b><br>• Explicar la <i>Definición de Comprensión Lectora</i>: No es solo decodificar (ver palabras), es procesar, interpretar y construir significado activo en la mente.",
                aiTip: "💡 Pista del Oráculo: Pregúntales si alguna vez han leído una página entera pensando en otra cosa y al final no recordaron nada. ¡Eso es falta de comprensión!"
            },
            {
                capitulo: "CAPÍTULO II",
                titulo: "LA NIEBLA DEL OLVIDO",
                imagen: "", 
                audioNarracion: "",
                texto: "Una sombra avanza sobre la biblioteca arcana. Si los aprendices no entienden para qué sirve dominar el conocimiento de estos libros, la sombra congelará sus mentes y no podrán avanzar...",
                pregunta: "✨ Pregunta a la clase: ¿Cuál es el propósito o la ventaja real de aprender a comprender a fondo lo que leemos? ¿De qué nos sirve en la vida diaria?",
                retroalimentacion: "<b>Concepto a retroalimentar:</b><br>• Explicar la <i>Importancia y Objetivos</i>: Fomenta el pensamiento crítico, la autonomía para tomar decisiones y el éxito académico y profesional.",
                aiTip: "💡 Pista del Oráculo: Relaciónalo con la libertad: 'Quien comprende lo que lee, nunca puede ser engañado fácilmente'."
            },
            {
                capitulo: "CAPÍTULO III",
                titulo: "EL PASILLO DE LOS ENCANTAMIENTOS",
                imagen: "", 
                audioNarracion: "",
                texto: "Llegan a un pasillo lleno de susurros y distracciones. Al fondo hay una puerta con un grabado dorado. Para atravesar el pasillo sin perderse, el libro exige preparar la mente antes de cruzar y mantener el enfoque durante el trayecto...",
                pregunta: "✨ Pregunta a la clase:<br>1) ¿Qué deben hacer ANTES de abrir la puerta observando solo el título del grabado?<br>2) ¿Qué hacen MIENTRAS avanzan para no distraerse?",
                retroalimentacion: "<b>Concepto a retroalimentar:</b><br>• <i>Estrategias ANTES:</i> Activar conocimientos previos, predecir el contenido e identificar el propósito.<br>• <i>Estrategias DURANTE:</i> Identificar ideas clave, formular preguntas internas y deducir significados por el contexto.",
                aiTip: "💡 Pista del Oráculo: Pregúntales qué hacen ellos cuando ven el título de una película antes de verla."
            },
            {
                capitulo: "CAPÍTULO IV",
                titulo: "LA PRUEBA DE LAS TRES RUNAS",
                imagen: "", 
                audioNarracion: "",
                texto: "El Guardián del Pasillo les muestra este pergamino: 'En el año 1020, la Maga Eldora invocó el Hechizo de Luz para salvar el reino de Astralia'. Ahora el Guardián exige tres respuestas para dejarlos pasar...",
                pregunta: "✨ Analicen juntos:<br>1. ¿En qué año y reino ocurrió? (Respuesta directa)<br>2. ¿Por qué creen que Eldora arriesgó su vida si el texto no lo dice explícitamente?<br>3. ¿Les parece que actuó correctamente?",
                retroalimentacion: "<b>Concepto a retroalimentar:</b><br>• Conectar con los <i>Niveles de Comprensión Lectora</i>:<br>1. <b>Nivel Literal:</b> Datos explícitos en el texto.<br>2. <b>Nivel Inferencial:</b> Deducir lo que está entre líneas.<br>3. <b>Nivel Crítico:</b> Emitir un juicio de valor personal.",
                aiTip: "💡 Pista del Oráculo: Muestra cómo cada pregunta sube un escalón de complejidad en la mente."
            },
            {
                capitulo: "CAPÍTULO V",
                titulo: "EL SELLO DEL CONOCIMIENTO",
                imagen: "", 
                audioNarracion: "",
                texto: "¡El pasillo se ilumina! Han alcanzado el salón principal. Pero la magia recién adquirida se disipará al instante si no realizan una última acción para fijar el conocimiento en sus memorias...",
                pregunta: "✨ Pregunta a la clase: ¿Qué técnica o herramienta usarían justo DESPUÉS de aprender algo nuevo para no olvidarlo nunca y podérselo explicar a otros?",
                retroalimentacion: "<b>Concepto a retroalimentar:</b><br>• <i>Estrategias DESPUÉS de la lectura:</i> Parafrasear (decirlo con tus palabras), hacer resúmenes, elaborar mapas conceptuales/mentales y reflexionar.",
                aiTip: "💡 Pista del Oráculo: Menciona el poder de hacer un esquema o un dibujo mental."
            }
        ];

        let indexEscena = 0;
        let typingTimeout;

        // Variables DOM
        const introScreen = document.getElementById("intro-screen");
        const btnStart = document.getElementById("btn-start");
        const btnStartOrb = document.getElementById("btn-start-orb");
        const cinemaStage = document.getElementById("cinema-stage");
        const chapterTag = document.getElementById("chapter-tag");
        const sceneTitle = document.getElementById("scene-title");
        const sceneImg = document.getElementById("scene-img");
        const sceneAudio = document.getElementById("scene-audio");
        const typewriterText = document.getElementById("typewriter-text");
        const questionCard = document.getElementById("question-card");
        const questionText = document.getElementById("question-text");
        const btnRevealGuide = document.getElementById("btn-reveal-guide");
        const groupGuide = document.getElementById("group-guide");
        const guideContent = document.getElementById("guide-content");
        const btnNextScene = document.getElementById("btn-next-scene");
        
        // Audio
        const bgMusic = document.getElementById("bg-music");
        const btnAudioToggle = document.getElementById("btn-audio-toggle");
        const volSlider = document.getElementById("vol-slider");
        let isPlaying = false;

        // Asistente IA
        const btnAi = document.getElementById("btn-ai");
        const aiModal = document.getElementById("ai-modal");
        const aiClose = document.getElementById("ai-close");
        const aiText = document.getElementById("ai-text");

        // --- EFECTO MÁQUINA DE ESCRIBIR ---
        function typeWriter(text, element, speed = 35, callback) {
            element.innerHTML = "";
            let i = 0;
            clearTimeout(typingTimeout);

            function type() {
                if (i < text.length) {
                    element.innerHTML += text.charAt(i);
                    i++;
                    typingTimeout = setTimeout(type, speed);
                } else if (callback) {
                    callback();
                }
            }
            type();
        }

        // --- CARGAR ESCENA ---
        function cargarEscena(index) {
            const data = historiaArcana[index];
            
            // Ocultar elementos previos
            questionCard.classList.remove("show");
            groupGuide.classList.add("hidden");
            btnRevealGuide.classList.add("hidden");

            // Cargar Encabezados
            chapterTag.textContent = data.capitulo;
            sceneTitle.textContent = data.titulo;
            guideContent.innerHTML = data.retroalimentacion;
            aiText.innerHTML = data.aiTip;

            // Cargar Imagen si existe
            if (data.imagen && data.imagen.trim() !== "") {
                sceneImg.src = data.imagen;
                sceneImg.classList.remove("hidden");
            } else {
                sceneImg.classList.add("hidden");
            }

            // Cargar Audio de Escena si existe
            if (data.audioNarracion && data.audioNarracion.trim() !== "") {
                sceneAudio.src = data.audioNarracion;
                sceneAudio.classList.remove("hidden");
            } else {
                sceneAudio.classList.add("hidden");
            }

            // Iniciar Efecto Máquina de Escribir para el Texto Narrativo
            typeWriter(data.texto, typewriterText, 30, () => {
                // Cuando termina de escribir, aparece la pregunta con un efecto suave
                questionText.innerHTML = data.pregunta;
                questionCard.classList.add("show");
                btnRevealGuide.classList.remove("hidden");
            });
        }

        // Iniciar Experiencia desde Pantalla Negra
        function iniciarExperiencia() {
            introScreen.style.opacity = "0";
            bgMusic.play().catch(() => {});
            isPlaying = true;
            btnAudioToggle.textContent = "🔊";

            setTimeout(() => {
                introScreen.classList.add("hidden");
                cinemaStage.classList.remove("hidden");
                cargarEscena(0);
            }, 1200);
        }

        btnStart.addEventListener("click", iniciarExperiencia);
        btnStartOrb.addEventListener("click", iniciarExperiencia);

        // Revelar Guía del Grupo
        btnRevealGuide.addEventListener("click", () => {
            groupGuide.classList.remove("hidden");
            btnRevealGuide.classList.add("hidden");
        });

        // Siguiente Escena
        btnNextScene.addEventListener("click", () => {
            indexEscena++;
            if (indexEscena < historiaArcana.length) {
                cargarEscena(indexEscena);
            } else {
                // Final Cinematográfico
                chapterTag.textContent = "EPÍLOGO";
                sceneTitle.textContent = "MAESTRÍA ALCANZADA";
                sceneImg.classList.add("hidden");
                sceneAudio.classList.add("hidden");
                questionCard.classList.remove("show");
                groupGuide.classList.add("hidden");
                btnRevealGuide.classList.add("hidden");
                
                typeWriter("El Grimorio brilla con intensidad. Han demostrado que comprender un texto no es un acto pasivo, sino un proceso mágico de interpretación y análisis. ¡Felicidades, Maestras y Aprendices!", typewriterText, 40);
            }
        });

        // Controles de Música
        btnAudioToggle.addEventListener("click", () => {
            if (isPlaying) {
                bgMusic.pause();
                btnAudioToggle.textContent = "🎵";
            } else {
                bgMusic.play();
                btnAudioToggle.textContent = "🔊";
            }
            isPlaying = !isPlaying;
        });

        volSlider.addEventListener("input", (e) => {
            bgMusic.volume = e.target.value;
        });

        // Controles Asistente IA
        btnAi.addEventListener("click", () => aiModal.classList.toggle("hidden"));
        aiClose.addEventListener("click", () => aiModal.classList.add("hidden"));
    </script>
</body>
</html>
